<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadow Man: The Kitchen Flux — Pocket v2.0 (R1+R2)</title>
<style>
 html,body{margin:0;padding:0;background:#070b16;height:100%;overflow:hidden}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
 canvas{display:block;background:#0b1020;touch-action:none;width:min(100vw,56.25vh);height:auto}
 #hud{position:fixed;left:0;right:0;top:0;pointer-events:none;font-family:ui-monospace,Menlo,monospace}
 #bankline{text-align:center;color:#cfe8ff;font-size:13px;padding:6px 4px 0;text-shadow:0 1px 3px #000}
 #bankline b{color:#e0a020} #bankline i{color:#60c060;font-style:normal}
 #msg{position:fixed;left:0;right:0;bottom:96px;text-align:center;color:#ffe9b0;font-family:ui-monospace,Menlo,monospace;font-size:15px;pointer-events:none;text-shadow:0 1px 4px #000;padding:0 18px}
 #controls{position:fixed;left:0;right:0;bottom:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 12px}
 #controls button{pointer-events:auto;background:#14203c;color:#cfe8ff;border:1px solid #2c4a7c;border-radius:12px;padding:13px 4px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
 #controls button.on{background:#274b2d;border-color:#60c060;color:#eaffea}
 #phraseRow{position:fixed;left:0;right:0;bottom:64px;text-align:center;display:none}
 #phrase{background:#0d1526;color:#cfe8ff;border:1px solid #2c4a7c;border-radius:9px;padding:7px 10px;width:210px;font-family:ui-monospace,Menlo,monospace;font-size:13px;text-align:center}
</style></head><body>
<div id="wrap"><canvas id="cv" width="720" height="1280"></canvas></div>
<div id="hud"><div id="bankline"></div></div>
<div id="msg"></div>
<div id="phraseRow"><input id="phrase" placeholder="type: consistency is key" autocomplete="off"></div>
<div id="controls">
 <button id="bStart">START</button><button id="bSample">SAMPLE ROOM</button><button id="bSub">SUB LOCK</button>
</div>
<script>
'use strict';
/* ============================================================
   SHADOW MAN POCKET v2.0 — R1 (seed the calm) + R2 (wild eddies,
   tool bank, drift & mergers) blended with the design-review fixes:
   fail-forward crossings, min(P,D) balance score, collapse->debris,
   tending pays, approach warnings, failure-mode ring signatures.
   Zak's numbers stand: EMAX 230, evolution = 1,000,000 power AND
   1,000,000 data SPENT, eon = one macro rotation paying out only
   with 23 stable Eddies standing. The universe PERSISTS between
   sessions (localStorage) — jump in, jump out, it keeps turning.
   ============================================================ */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=720,H=1280,CX=360,CY=560;
const WORLD_W=2160,WORLD_H=1720;
const PX=1080,PY=860;                 /* transducer pair centre (world) */
const EMAX=230,JEANS=55;
const EVO_COST=1000000;               /* per bank, Zak's number */
const EON_STABLE=23;                  /* Zak's number */
const COL={cyan:'#40c0e0',green:'#60c060',gold:'#e0a020',violet:'#a080e0',red:'#e05050',dim:'#5a7292',amber:'#ffb040'};
const $=id=>document.getElementById(id);
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function dphi(a,b){return Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));}
function hash2(a,b){let n=(a*374761393+b*668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295;}
/* Zak's measured voice signature (Energy Monitor, 2026-10-27) — the BASE SEED */
const SIG_ARC=[0.418,0.487,0.236,0.392,0.626,0.863,1.0,0.539,0.150,0.391,0.213,0.155];
/* ---------- persistent universe ---------- */
let U=null;
function newUniverse(){return{pow:0,dat:0,toolInd:1,toolCap:1,systems:[],debris:[],evolved:0,eons:0,evoProgress:0,
  totalStabilized:0,records:[],seen:{},evoBankedP:0,evoBankedD:0};}
function loadU(){try{const raw=localStorage.getItem('smu2');if(raw){U=Object.assign(newUniverse(),JSON.parse(raw));return;}}catch(e){} U=newUniverse();}
let saveT=0;
function saveU(){const now=performance.now();if(now-saveT<800)return;saveT=now;try{localStorage.setItem('smu2',JSON.stringify(U));}catch(e){}}
function saveUnow(){try{localStorage.setItem('smu2',JSON.stringify(U));}catch(e){}}
/* ---------- session state ---------- */
let S=null;
function newGame(){return{phase:'start',t:0,frame:0,rot:0,zoomT:0,revealT:0,sample:0,arc:SIG_ARC.slice(),level:0.30,
 mode:'default',band:'base',over:false,won:false,qf:false,sub:false,hold:0,peak:0,peakV:0,beats:0,combo:0,
 camX:0,camY:860,zoom:1,grid:null,player:{x:240,y:1500,vx:0,vy:0},waves:[],pickups:[],calms:[],wilds:[],
 eddy:null,ind:null,cap:null,ind2:null,sats:[],ball:null,choice:null,msgT:0,pings:[],flows:[],
 pairGap:1,pairMass:1,pairInst:0,pairPhase:0,reseeds:0,seedP:0,seedD:0,sessP:0,sessD:0,sessLeft:0,
 cross:null,static0:0.55,regrow:0.0007,attune:0,recordsOpen:false,touch:null,btnFrame:-9,btnHold:0,pillLabel:'RESEED',
 sysMsgCd:0,ctxLabel:'',calmHint:false,adoptHint:false};}
/* static grid */
const CS=60,GW=Math.ceil(WORLD_W/CS),GH=Math.ceil(WORLD_H/CS);
function buildGrid(){S.grid=new Float32Array(GW*GH);const cov=S.static0;
 for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){S.grid[r*GW+c]=hash2(c*7+3,r*13+5)<cov?0.06:0.55;}
 /* start pocket pre-cleared */
 for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){const x=c*CS+30,y=r*CS+30;
  if(Math.hypot(x-S.player.x,y-S.player.y)<380)S.grid[r*GW+c]=Math.max(S.grid[r*GW+c],0.8);}}
function cellAt(x,y){if(!S.grid)return 0;const c=clamp(Math.floor(x/CS),0,GW-1),r=clamp(Math.floor(y/CS),0,GH-1);return S.grid[r*GW+c];}
function viewR(){const d=Math.abs(S.peak);let v=210+(1-clamp(d,0,1))*330+(S.hold>0?130:0)+(S.sub?40:0);
 if(S.band==='major')v*=0.75; return v;}
function tymF(){return S.hold>0?1:0.15+0.85*clamp(1-Math.abs(S.peak),0,1);}
/* ---------- narrator / teaching ---------- */
const TEACH={
 cross:'Waves carry phase. Cross at the trough, never the crest.',
 seed:'Frozen-in flux: the field moves with the flow. What you plant keeps its identity.',
 adopt:'A wild eddy, adopted. It was already a standing pattern — you are joining it, not making it.',
 orbit:'Two windings — toroidal around, poloidal through. Coupled right, an eddy holds itself.',
 firstSys:'A stable system. Circulation that returns is what keeps anything alive.',
 debris:'Nothing is lost. Destruction is a form change — debris can be stabilized and banked.',
 tend:'Maintenance is a harvest run: a tended system pays its trickle out.',
 merge:'Taylor relaxation: merged systems settle to the lowest energy that keeps their helicity.',
 danger:'Dangerous class: it grows on its own and sheds instability. Greed has a limit.',
 hole:'A black hole eddy: a sink. It does not circulate — it only takes.',
 bank:'The tool bank: found, banked, deployed, spent tending. Tools are currency with three jobs.',
 eon:'An eon ticked. The universe pays rent on stability kept.'};
function msg(t){$('msg').textContent=t;S.msgT=S.frame;}
function teach(key){if(U.seen[key])return;U.seen[key]=1;msg(TEACH[key]);saveU();}
function ping(x,y,col,big){S.pings.push({x:x,y:y,r:big?26:13,col:col||COL.cyan,t:0,big:!!big});}
/* ---------- bands & sample ---------- */
function bandParams(){switch(S.band){
 case 'major':return{static0:0.80,regrow:0.0012,amp:1.30,label:'MAJOR'};
 case 'moderate':return{static0:0.62,regrow:0.0008,amp:1.00,label:'MODERATE'};
 case 'light':return{static0:0.50,regrow:0.0006,amp:0.85,label:'LIGHT'};
 default:return{static0:0.35,regrow:0.0004,amp:0.70,label:'BASE (your voice)'};}}
let AC=null,AN=null,micStream=null;
function startSample(){
 if(S.phase!=='sample')return;
 const done=(arc,level,real)=>{S.arc=arc;S.level=level;
  if(S.mode==='comp'){S.band=level>=0.62?'major':level>=0.38?'moderate':'light';}
  const bp=bandParams();S.static0=bp.static0;S.regrow=bp.regrow;
  S.phase='settle';S.sample=0;msg(real?'Sampled. The room settles against its mirror.':'No mic — base seed stands in.');};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){done(SIG_ARC.slice(),0.30,false);return;}
 navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{micStream=st;
  AC=new (window.AudioContext||window.webkitAudioContext)();AN=AC.createAnalyser();AN.fftSize=2048;
  const src=AC.createMediaStreamSource(st);src.connect(AN);
  const buf=new Float32Array(AN.fftSize),env=[];const t0=performance.now();
  const tick=()=>{AN.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
   env.push(Math.sqrt(s/buf.length));
   if(performance.now()-t0<3000){requestAnimationFrame(tick);return;}
   st.getTracks().forEach(t=>t.stop());if(AC)AC.close();
   const slots=24,arc=[];for(let i=0;i<slots;i++){const a=env[Math.floor(i*env.length/slots)]||0;arc.push(a);}
   const mx=Math.max(...arc,0.001);for(let i=0;i<slots;i++)arc[i]=clamp(arc[i]/mx,0,1);
   const level=clamp((env.reduce((a,b)=>a+b,0)/env.length)*6,0.05,1);
   done(arc,level,true);};
  requestAnimationFrame(tick);
 }).catch(()=>done(SIG_ARC.slice(),0.30,false));}
/* ---------- world generation ---------- */
function genWorld(){const bp=bandParams();buildGrid();
 S.waves=[];const angs=[0.12,0.5,-0.3,0.9,0.25];
 for(let i=0;i<5;i++){const a=angs[i]+(hash2(i,7)-0.5)*0.2;
  S.waves.push({dx:Math.cos(a),dy:Math.sin(a),a:i*430+hash2(i,3)*200,lambda:520+hash2(i,11)*160,
   speed:(26+hash2(i,5)*16)*bp.amp,enc:null,cool:0});}
 S.calms=[];let tries=0;
 while(S.calms.length<5&&tries++<300){const x=200+hash2(tries,21)*1760,y=200+hash2(tries,23)*1320;
  if(Math.hypot(x-PX,y-PY)<420)continue;if(Math.hypot(x-S.player.x,y-S.player.y)<340)continue;
  if(S.calms.some(c=>Math.hypot(c.x-x,c.y-y)<430))continue;
  S.calms.push({x:x,y:y,r:130+hash2(tries,29)*60});}
 S.pickups=[];const kinds=['ind','cap','ind','cap','ind','cap','ind','cap','ind','cap'];
 for(let i=0;i<kinds.length;i++){const x=140+hash2(i,31)*1880,y=140+hash2(i,37)*1440;
  S.pickups.push({type:kinds[i],x:x,y:y,taken:false,ph:hash2(i,41)*6.28});}
 S.wilds=[];const wspec=[['standard',52],['standard',64],['standard',44],['dangerous',78],['dangerous',66],['hole',46]];
 for(const sp of wspec){let placed=false;
  for(let tr=0;tr<900&&!placed;tr++){const x=240+hash2(tr*3+sp[1],43)*1680,y=240+hash2(tr*5+sp[1],47)*1240;
   const sep=tr<250?470:tr<550?390:310,far=tr<550?1:0.8;
   if(Math.hypot(x-PX,y-PY)<450*far)continue;
   if(Math.hypot(x-S.player.x,y-S.player.y)<410*far)continue;
   if(S.wilds.some(w=>Math.hypot(w.x-x,w.y-y)<sep))continue;
   if(S.calms.some(c=>Math.hypot(c.x-x,c.y-y)<370*far))continue;
   S.wilds.push({cls:sp[0],x:x,y:y,r:sp[1],ph:hash2(tr,53)*6.28,condenses:0,grow:0});placed=true;}}
 S.camX=clamp(S.player.x-CX*0.9,0,WORLD_W-W);S.camY=clamp(S.player.y-CY*0.9,0,WORLD_H-H);}
function ampAt(x,y){let a=0;for(const f of S.waves){
  const u=x*f.dx+y*f.dy;let d=((u-f.a)%f.lambda+f.lambda)%f.lambda;d=Math.min(d,f.lambda-d);
  a+=Math.max(0,1-d/130);}
 for(const c of S.calms){if(Math.hypot(x-c.x,y-c.y)<c.r)a*=0.22;}
 return a;}
/* ---------- seeding / adopting / salvage / tending ---------- */
function makeKnobs(ex,ey,r){S.ind={x:ex-120,y:ey+140,r:30,fill:0,active:false,held:false,ph:Math.random()*6.28,orb:false,oa:0};
 S.cap={x:ex+r+90,y:ey+30,r:26,fill:0,active:false,held:false,ph:Math.random()*6.28,charge:0,orb:false,oa:0};}
function doSeed(cx,cy,adopted){
 if(U.toolInd<1||U.toolCap<1){msg('The bank is short — seeding takes 1 inducer + 1 capacitor. Keep gathering.');return;}
 U.toolInd--;U.toolCap--;
 S.eddy={x:cx,y:cy,r:adopted?adopted.r:42,weight:0,spin:0.4,ph:0,wob:0,clarity:0,anchored:false,
  storeP:0,storeD:0,accP:0,accD:0,stability:0,ready:false,adopted:adopted||null,tipWarned:0};
 if(adopted){const i=S.wilds.indexOf(adopted);if(i>=0)S.wilds.splice(i,1);}
 makeKnobs(cx,cy,S.eddy.r);S.phase='play';S.spawned=true;
 ping(cx,cy,COL.gold,true);
 if(adopted){teach('adopt');msg('Eddy adopted. Grow it gently — greed has a limit.');}
 else{teach('seed');msg('Seeded. Fill the tools by position — inducer to the core, capacitor to the ring.');}
 if(!U.seen.seedDrag){U.seen.seedDrag=1;saveU();
  msg('Seeded! DRAG the cyan inducer into the gold core circle. DRAG the green capacitor onto the green ring.');}
 saveU();}
function doSalvage(d){
 if(U.toolInd<1||U.toolCap<1){msg('Salvage takes 1 inducer + 1 capacitor from the bank.');return;}
 U.toolInd--;U.toolCap--;U.pow+=d.p;U.dat+=d.d;
 const i=U.debris.indexOf(d);if(i>=0)U.debris.splice(i,1);
 ping(d.x,d.y,COL.green,true);teach('debris');msg('Debris stabilized and banked: ⚡'+Math.round(d.p)+' ◆'+Math.round(d.d)+'.');
 S.sessP+=d.p;S.sessD+=d.d;saveU();}
function doTend(sys){
 if(U.toolCap<1&&U.toolInd<1){msg('Nothing in the bank to tend with. Gather tools first.');return;}
 if(U.toolCap>=1)U.toolCap--;else U.toolInd--;
 sys.stab=clamp(sys.stab+0.45,0,1);sys.dvx=0;sys.dvy=0;
 const gp=Math.round(sys.accP),gd=Math.round(sys.accD);
 U.pow+=sys.accP;U.dat+=sys.accD;S.sessP+=sys.accP;S.sessD+=sys.accD;sys.accP=0;sys.accD=0;
 ping(sys.x,sys.y,COL.green,true);teach('tend');
 msg('Tended. Trickle banked: ⚡'+gp+' ◆'+gd+'. Its placement holds again.');saveU();}
/* ---------- context action (the pill) ---------- */
function nearCtx(){
 const p=S.player;
 for(const d of U.debris)if(Math.hypot(p.x-d.x,p.y-d.y)<150)return{kind:'salvage',o:d,label:'SALVAGE'};
 for(const s of U.systems)if(Math.hypot(p.x-s.x,p.y-s.y)<s.r+110)return{kind:'tend',o:s,label:'TEND'};
 if(S.phase==='nav'){
  for(const w of S.wilds)if(w.cls!=='hole'&&Math.hypot(p.x-w.x,p.y-w.y)<w.r)return{kind:'adopt',o:w,label:'ADOPT'};
  for(const c of S.calms)if(Math.hypot(p.x-c.x,p.y-c.y)<c.r*0.8)return{kind:'seed',o:c,label:'SEED'};
 }
 return null;}
function pillTap(){
 if(S.phase==='nav'||(S.phase==='play'&&!S.eddy)){const c=nearCtx();if(!c)return;
  if(c.kind==='seed')doSeed(c.o.x,c.o.y,null);
  else if(c.kind==='adopt')doSeed(c.o.x,c.o.y,c.o);
  else if(c.kind==='salvage')doSalvage(c.o);
  else if(c.kind==='tend')doTend(c.o);return;}
 if(S.phase==='play'){const c=nearCtx();
  if(c&&(c.kind==='salvage'||c.kind==='tend')&&Math.hypot(S.player.x-S.eddy.x,S.player.y-S.eddy.y)>S.eddy.r+200){
   if(c.kind==='salvage')doSalvage(c.o);else doTend(c.o);return;}
  doReseed();}}
function pillHold(){if(S.choice){anchorChoice();return;}if(S.phase==='play'||S.phase==='nav')toggleQF();}
/* ---------- tympany ---------- */
function tapTympany(){
 if(S.qf||S.hold>0)return;
 if(S.phase!=='play'&&S.phase!=='nav')return;
 /* crossing beat? (beat-train: tap inside the window; dead-centre counts double) */
 if(S.cross&&S.cross.windowOpen&&!S.cross.tapped){
  S.cross.good+=S.cross.perfect?2:1;S.cross.tapped=true;
  ping(S.player.x,S.player.y,COL.gold);S.peak*=0.4;return;}
 const inBand=Math.abs(S.peak)<0.34;
 if(inBand){S.beats++;S.peak*=0.35;
  if(S.beats>=3){S.hold=30*60;S.beats=0;ping(S.player.x,S.player.y,COL.gold,true);msg('CENTRED HOLD — space stabilizes around you.');}
 }else{S.beats=0;S.peak-=Math.sign(S.peak)*0.22;}
}
function tympanyStep(dt){
 if(S.phase!=='play'&&S.phase!=='nav')return;
 const fr=dt*60;
 if(S.hold>0){S.hold-=fr;S.peak*=0.9;}
 else{const push=0.0016+ampAt(S.player.x,S.player.y)*0.0011;
  S.peakV+= (S.peak>0?push:-push)*fr*(0.4+Math.abs(S.peak));
  S.peakV*=0.985;S.peak+=S.peakV*fr;
  if(S.peak>1.15){S.peak=1.15;S.peakV*=-0.4;} if(S.peak<-1.15){S.peak=-1.15;S.peakV*=-0.4;}}
 if(Math.abs(S.peak)>0.88){S.tym=clamp((S.tym||1)-0.0016*fr,0,1);}else{S.tym=clamp((S.tym||1)+0.001*fr,0,1);}
 if((S.tym||1)<=0)lose('tympany collapse — the membrane lost the room.');}
/* ---------- navigation (the wave world) ---------- */
function ampInfo(x,y){let a=0,bx=0,by=0,bf=null;
 for(const f of S.waves){const u=x*f.dx+y*f.dy;let d=((u-f.a)%f.lambda+f.lambda)%f.lambda;d=Math.min(d,f.lambda-d);
  const c=Math.max(0,1-d/130);if(c>a){a=c;bx=f.dx;by=f.dy;bf=f;}}
 for(const c of S.calms){if(Math.hypot(x-c.x,y-c.y)<c.r)a*=0.22;}
 return{a:a,dx:bx,dy:by,front:bf};}
function navStep(dt){
 const p=S.player;
 if(!S.qf)for(const f of S.waves)f.a+=f.speed*dt;
 /* player movement: seek the finger; waves push (px/s physics) */
 let dvx=0,dvy=0;
 if(S.seek){const dx=S.seek.x-p.x,dy=S.seek.y-p.y,d=Math.hypot(dx,dy);
  if(d>6){const sp=Math.min(330,d*4);dvx=dx/d*sp;dvy=dy/d*sp;}}
 const k=Math.min(1,dt*7);p.vx+=(dvx-p.vx)*k;p.vy+=(dvy-p.vy)*k;
 if(!S.qf){const ai=ampInfo(p.x,p.y);
  if(ai.a>0.2&&ai.front){const push=S.cross?430:250;
   p.vx+=ai.dx*ai.a*push*dt;p.vy+=ai.dy*ai.a*push*dt;}
  /* --- crossings: entering a crest band commits you to its beat-train ---
     3 beats at trough spacing; 2 good slips you; dead-centre counts double;
     backing out beyond 200px before the verdict is always free. */
  if(!S.cross){
   for(const f of S.waves){if(f.restT&&S.frame<f.restT)continue;
    const u=p.x*f.dx+p.y*f.dy;let d=((u-f.a)%f.lambda+f.lambda)%f.lambda;d=Math.min(d,f.lambda-d);
    if(d<105){const sgn=Math.sign(p.vx*f.dx+p.vy*f.dy)||1;
     const sc=S.band==='major'?0.8:S.band==='moderate'?0.9:1;
     S.cross={front:f,t:0,fired:0,good:0,windowOpen:false,perfect:false,tapped:false,sgn:sgn,entryU:u,bt:[0.15*sc,0.70*sc,1.25*sc]};
     break;}}
  }else{const c=S.cross;c.t+=dt;
   const u=p.x*c.front.dx+p.y*c.front.dy;
   const travel=(u-c.entryU)*c.sgn;
   if(travel>200&&c.fired<3){
    /* out the far side: traversal — the clock no longer judges you */
    if(c.good>=2){U.pow+=2;S.sessP+=2;c.front.restT=S.frame+180;
     ping(p.x,p.y,COL.gold);teach('cross');msg('Through on the trough beats. +⚡2 — the wave paid you.');}
    else msg('Muscled through untimed — no trough, no pay.');
    S.cross=null;}
   else if(travel<-200&&c.fired<3){S.cross=null;} /* backed out — always free */
   else{
    c.windowOpen=false;c.perfect=false;
    if(c.fired<3){const bt=c.bt[c.fired];
     if(Math.abs(c.t-bt)<0.16){c.windowOpen=true;c.perfect=Math.abs(c.t-bt)<0.06;}
     if(c.t>bt+0.16){c.fired++;c.tapped=false;}}
    if(c.fired>=3){
     if(c.good>=2){U.pow+=2;S.sessP+=2;c.front.restT=S.frame+180;
      ping(p.x,p.y,COL.gold);teach('cross');msg('Crossed at the trough. +⚡2 — the wave paid you.');}
     else{/* FAIL FORWARD: back the way you came */
      p.vx=-c.sgn*c.front.dx*300;p.vy=-c.sgn*c.front.dy*300;
      S.peak+=(S.peak>=0?0.55:-0.55);S.pairInst=clamp(S.pairInst+0.04,0,1);S.unmanaged=(S.unmanaged||0)+1;
      msg('Crest hit — shoved back. Two good taps in the trough windows slips you through.');}
     S.cross=null;}}
  }
 }

function playStep(dt){
 const e=S.eddy;if(!e)return;const fr=dt*60;
 e.ph+=dt*(0.7+e.spin);e.wob=Math.sin(S.frame*0.05)*3;

   else{siphon(1.0*mult*dt,false);}}

 e.spin+= ((anyLock?0.9:0.35)-e.spin)*0.01*fr;

 else e.stability=clamp(e.stability-0.02*fr*0.016,0,1);

  o.held=true;S.dragTool=o;

  let tgt=null,verb='';

   let bd=1e9;for(const c of S.calms){const d=Math.hypot(c.x-S.player.x,c.y-S.player.y);if(d<bd){bd=d;tgt=c;}}
   for(const w of S.wilds){if(w.cls==='hole')continue;const d=Math.hypot(w.x-S.player.x,w.y-S.player.y);if(d<bd){bd=d;tgt=w;}}
   verb='SEED / ADOPT';}
  else{let bd=1e9;for(const t of S.pickups){if(t.taken)continue;const d=Math.hypot(t.x-S.player.x,t.y-S.player.y);if(d<bd){bd=d;tgt=t;}}
   verb='GATHER';}
  if(tgt){ctx.strokeStyle='rgba(224,160,32,0.5)';ctx.setLineDash([12,10]);ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(S.player.x,S.player.y);ctx.lineTo(tgt.x,tgt.y);ctx.stroke();ctx.setLineDash([]);
   ctx.strokeStyle='rgba(255,215,100,'+(0.5+0.3*Math.sin(S.frame*0.12))+')';ctx.lineWidth=3;
   ctx.beginPath();ctx.arc(tgt.x,tgt.y,(tgt.r||40)+16,0,7);ctx.stroke();
   ctx.fillStyle='#ffe9b0';ctx.font='bold 16px ui-monospace,monospace';ctx.textAlign='center';
   ctx.fillText(verb,tgt.x,tgt.y-(tgt.r||40)-28);}}
 /* active eddy */
 const e=S.eddy;
 if(e){ if(e.r>150){ctx.strokeStyle='rgba(224,160,32,0.25)';ctx.setLineDash([10,10]);
   ctx.beginPath();ctx.arc(e.x,e.y,EMAX,0,7);ctx.stroke();ctx.setLineDash([]);}
  spiral(e.x,e.y,e.r,COL.cyan,2,3,S.frame*0.02);
  if(e.weight>1){ctx.fillStyle='rgba(224,160,32,0.9)';ctx.beginPath();
   ctx.arc(e.x,e.y,Math.min(e.r*0.5,4+e.weight*0.35),0,7);ctx.fill();}
  ctx.strokeStyle=COL.gold;ctx.lineWidth=3;ctx.beginPath();
  ctx.arc(e.x,e.y,e.r+30,-Math.PI/2,-Math.PI/2+e.stability*Math.PI*2);ctx.stroke();
  if(e.ready){ctx.strokeStyle='rgba(255,215,100,'+(0.6+0.4*Math.sin(S.frame*0.25))+')';ctx.lineWidth=3;
   ctx.beginPath();ctx.arc(e.x,e.y,e.r+40,0,7);ctx.stroke();
   for(let i=0;i<4;i++){const a=i*Math.PI/2+S.frame*0.02;ctx.fillStyle=COL.gold;
    ctx.beginPath();ctx.arc(e.x+(e.r+40)*Math.cos(a),e.y+(e.r+40)*Math.sin(a),5,0,7);ctx.fill();}}
  if(e.anchored){ctx.strokeStyle='rgba(224,160,32,0.6)';ctx.strokeRect(e.x-e.r-8,e.y-e.r-8,(e.r+8)*2,(e.r+8)*2);}
  for(const s of S.sats)spiral(s.x,s.y,s.r,COL.cyan,2,2,S.frame*0.015);
  const drawKnob=(o,col)=>{if(!o)return;
   ctx.fillStyle='#0d1730';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();
   ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.stroke();
   ctx.strokeStyle=COL.gold;ctx.beginPath();ctx.arc(o.x,o.y,o.r,-Math.PI/2,-Math.PI/2+o.fill*Math.PI*2);ctx.stroke();
   ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x,o.y);
   ctx.lineTo(o.x+Math.cos(o.ph)*(o.r-4),o.y+Math.sin(o.ph)*(o.r-4));ctx.stroke();
   if(o.orb){ctx.strokeStyle='rgba(255,215,100,0.8)';ctx.beginPath();ctx.arc(o.x,o.y,o.r+5,0,7);ctx.stroke();}};
  if(S.attune>=2){ctx.strokeStyle='rgba(64,192,224,0.3)';ctx.setLineDash([5,7]);
   ctx.beginPath();ctx.arc(e.x,e.y,e.r*0.58,0,7);ctx.stroke();ctx.setLineDash([]);}
  if(S.attune>=3){ctx.strokeStyle='rgba(96,192,96,0.3)';ctx.setLineDash([5,7]);
   ctx.beginPath();ctx.arc(e.x,e.y,e.r+18,0,7);ctx.stroke();ctx.setLineDash([]);}
  if(!U.seen.placed){
   ctx.strokeStyle='rgba(224,160,32,0.75)';ctx.setLineDash([7,7]);ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(e.x,e.y,Math.max(14,e.r*0.62),0,7);ctx.stroke();ctx.setLineDash([]);
   ctx.strokeStyle='rgba(96,220,120,0.75)';ctx.setLineDash([7,7]);
   ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle='rgba(224,160,32,0.30)';ctx.beginPath();ctx.arc(e.x,e.y,30,0,7);ctx.fill();
   ctx.fillStyle='#ffe9b0';ctx.font='bold 15px ui-monospace,monospace';ctx.textAlign='center';
   ctx.fillText('INDUCER → CORE',e.x,e.y-e.r-44);
   ctx.fillStyle='#baffc9';ctx.fillText('CAPACITOR → RING',e.x,e.y+e.r+34);
   for(const [o,nm] of [[S.ind,'I'],[S.cap,'C']]){if(o&&!o.active){
    ctx.fillStyle='#fff';ctx.font='bold 14px ui-monospace,monospace';
    ctx.fillText(nm+' '+Math.round(o.fill*100)+'%',o.x,o.y-42);}}
  }
  if(S.dragTool&&e){const o=S.dragTool;
   const isCap=o===S.cap;let txp=e.x,typ=e.y;
   if(isCap){const a=Math.atan2(o.y-e.y,o.x-e.x);txp=e.x+Math.cos(a)*e.r;typ=e.y+Math.sin(a)*e.r;}
   ctx.strokeStyle='rgba(255,215,100,0.8)';ctx.setLineDash([6,6]);ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(txp,typ);ctx.stroke();ctx.setLineDash([]);}
  drawKnob(S.ind,COL.cyan);drawKnob(S.cap,COL.green);drawKnob(S.ind2,'#2a7ea6');
  if(S.ball){const b=S.ball;ctx.fillStyle=COL.gold;ctx.beginPath();ctx.arc(b.x,b.y,15,0,7);ctx.fill();
   ctx.strokeStyle=b.t<10?COL.red:'#ffe9b0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,21,-Math.PI/2,-Math.PI/2+(b.t/50)*Math.PI*2);ctx.stroke();}}
 /* flows + pings */
 for(const f of S.flows){ctx.strokeStyle=f.col;ctx.globalAlpha=1-f.t;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x+(f.x2-f.x)*f.t,f.y+(f.y2-f.y)*f.t);ctx.stroke();ctx.globalAlpha=1;}
 for(const g of S.pings){ctx.strokeStyle=g.col;ctx.globalAlpha=1-g.t;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(g.x,g.y,g.r*(0.4+g.t*2.2),0,7);ctx.stroke();ctx.globalAlpha=1;}
 /* player */
 const p=S.player,vr=viewR();
 ctx.fillStyle='rgba(255,215,100,0.05)';ctx.beginPath();ctx.arc(p.x,p.y,vr,0,7);ctx.fill();
 ctx.strokeStyle=COL.gold;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,13,0,7);ctx.stroke();
 ctx.beginPath();ctx.moveTo(p.x-20,p.y);ctx.lineTo(p.x-7,p.y);ctx.moveTo(p.x+7,p.y);ctx.lineTo(p.x+20,p.y);
 ctx.moveTo(p.x,p.y-20);ctx.lineTo(p.x,p.y-7);ctx.moveTo(p.x,p.y+7);ctx.lineTo(p.x,p.y+20);ctx.stroke();
 if(S.phase==='nav'&&S.ctxLabel){ctx.fillStyle='#ffd75e';ctx.font='bold 19px ui-monospace,monospace';ctx.textAlign='center';
  ctx.fillText('▼ TAP PILL: '+S.ctxLabel,p.x,p.y-58);}
 if(S.cross){ctx.fillStyle=S.cross.windowOpen?'#ffd75e':'#ffb040';ctx.font='bold 20px ui-monospace,monospace';ctx.textAlign='center';
  ctx.fillText('♪ '+Math.min(3,S.cross.good)+'/'+(S.cross.fired+(S.cross.windowOpen?1:0))+' beats',p.x,p.y-34);}
 ctx.setTransform(1,0,0,1,0,0);
 /* tympany strip */
 if(inGame){const y=64,bx=70,bw=W-140;
  ctx.fillStyle='rgba(10,16,32,0.85)';ctx.fillRect(bx-8,y-22,bw+16,52);
  ctx.strokeStyle=COL.dim;ctx.strokeRect(bx-8,y-22,bw+16,52);
  ctx.fillStyle='rgba(255,140,40,0.35)';const rw=bw*0.34;
  ctx.fillRect(CX-rw/2,y-8,rw,16);
  ctx.strokeStyle='#8899bb';ctx.beginPath();ctx.moveTo(bx,y);ctx.lineTo(bx+bw,y);ctx.stroke();
  const bxp=CX+clamp(S.peak,-1.15,1.15)*(bw/2-14);
  ctx.fillStyle=S.hold>0?COL.gold:'#fff';ctx.beginPath();ctx.arc(bxp,y,9,0,7);ctx.fill();
  if(S.hold>0){ctx.fillStyle=COL.gold;ctx.font='13px ui-monospace,monospace';ctx.textAlign='center';
   ctx.fillText('HOLD '+Math.ceil(S.hold/60)+'s',CX,y-30);}
  ctx.fillStyle=(S.tym||1)<0.3?COL.red:COL.green;ctx.fillRect(bx,y+18,bw*clamp(S.tym||1,0,1),4);
  ctx.fillStyle=COL.dim;ctx.font='12px ui-monospace,monospace';ctx.textAlign='left';
  ctx.fillText('TYMPANY',bx,y-30);ctx.textAlign='right';ctx.fillText(S.band.toUpperCase()+' · '+(S.qf?'QUIET FIELD':'FLOWING'),bx+bw,y-30);
  /* pill */
  const label=pillLabel();
  const isVerb=['SEED','ADOPT','TEND','SALVAGE'].includes(label);
  ctx.fillStyle=S.qf?'#274b2d':'#14203c';ctx.strokeStyle=COL.gold;
  ctx.lineWidth=isVerb?3+2*Math.sin(S.frame*0.18):2;
  ctx.beginPath();ctx.roundRect(CX-135,H-222,270,72,16);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffe9b0';ctx.font='bold 19px ui-monospace,monospace';ctx.textAlign='center';
  ctx.fillText(S.qf?'QF · '+label:label,CX,H-178);
  if(S.sub){ctx.fillStyle=COL.green;ctx.font='12px ui-monospace,monospace';ctx.fillText('SUBHARMONIC LOCK · half yield',CX,H-100);}}
}
/* ---------- boot ---------- */
loadU();S=newGame();loop();
</script></body></html>
